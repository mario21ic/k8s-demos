apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "enforce-secret-file-access-pid1-only"
spec:
  kprobes:
    # Hook into security_file_permission, a common enforcement point for file access
    - call: "security_file_permission"
      args:
        - index: 0
          type: "file"
      selectors:
        - matchArgs:
            # Check if the requested access includes read permissions (R_OK)
            - index: 1
              operator: "In"
              values:
                - "R_OK"
          matchPaths:
            # Specify the path of your sensitive file
            - operator: "In"
              values:
                - "/etc/secret/my-secret.txt"
        - matchPIDs:
            # Check if the process PID is NOT the container's init process (PID 1)
            - operator: "NotIn"
              values:
                - 1
          # If the above conditions are met, the action is to kill the process
          action: "SIGKILL"

